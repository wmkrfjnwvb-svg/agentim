# cargo-deny (docs/en/design/developer-experience.md): licenses, known vulnerabilities and where
# crates come from, for both Rust workspaces (server/, sdk/client-rust/):
#   cargo deny --manifest-path server/Cargo.toml check --config deny.toml

[graph]
all-features = true

[advisories]
# RustSec: a vulnerability fails the check; an unmaintained or yanked
# crate fails it too, so it gets a decision (listed here with the reason).
version = 2
yanked = "deny"
unmaintained = "workspace"
ignore = [
  # SQLite before 3.54 can return stale page-cache memory when it opens a
  # database together with a crafted -wal file. AgentIM opens SQLite only at
  # paths from the operator's own configuration, in its data directory, so
  # the attacker must already be able to write there. The fix is in
  # libsqlite3-sys 0.39, which sqlx 0.9.0 does not allow (< 0.38); remove
  # this line when sqlx does.
  { id = "RUSTSEC-2026-0459", reason = "local only; files are the operator's own; waiting for sqlx to allow libsqlite3-sys 0.39" },
]

[licenses]
version = 2
# Permissive licenses only, compatible with Apache-2.0 (our license).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
