apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "agentim.name" . }}
  labels: {{- include "agentim.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "agentim.name" . }}-peers
  replicas: {{ .Values.replicas }}
  # Nodes join and leave one at a time without waiting for each other.
  podManagementPolicy: Parallel
  selector:
    matchLabels: {{- include "agentim.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "agentim.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      initContainers:
        # The database URL goes into the config file without landing in
        # the ConfigMap.
        - name: config
          image: busybox:1.36
          command: ["sh", "-c", "sed \"s|\\${DATABASE_URL}|$DATABASE_URL|\" /config/agentim.toml > /run/agentim/agentim.toml"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: {{ .Values.existingSecret }}, key: database-url}}
          volumeMounts:
            - {name: config, mountPath: /config}
            - {name: run, mountPath: /run/agentim}
      containers:
        - name: agentim
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/run/agentim/agentim.toml", "--log-format", "json"]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: AGENTIM_NODE_ID
              value: "$(POD_NAME)"
            - name: AGENTIM_CLUSTER_ADVERTISE
              value: "$(POD_NAME).{{ include "agentim.name" . }}-peers.{{ .Release.Namespace }}.svc:7946"
          ports:
            - {name: http, containerPort: 8080}
            - {name: cluster, containerPort: 7946}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            failureThreshold: 6
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: run, mountPath: /run/agentim}
            - {name: key, mountPath: /run/agentim/master-key, subPath: master-key, readOnly: true}
      volumes:
        - name: config
          configMap: {name: {{ include "agentim.name" . }}}
        - name: run
          emptyDir: {medium: Memory}
        - name: key
          secret: {secretName: {{ .Values.existingSecret }}, items: [{key: master-key, path: master-key}]}
