# Client SDK packages (docs/12 §2.12.1): builds the native core for each
# platform, the XCFramework, the NuGet package and the npm packages, and
# uses each the way an app would, against a real server. sdk-release.yml
# runs it on an sdk-v* tag and publishes what it built.
#
# Third-party actions are pinned to a commit: these packages get published.
name: sdk-packages

on:
  push:
    paths: ["sdk/**", ".github/workflows/sdk-packages.yml"]
  pull_request:
    paths: ["sdk/**", ".github/workflows/sdk-packages.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native core ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28 and newer (Debian 10, Ubuntu 20.04, RHEL 8).
          - {rid: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: ".2.28", file: libagentim_client.so}
          - {rid: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: ".2.28", file: libagentim_client.so}
          - {rid: osx-x64, os: macos-latest, target: x86_64-apple-darwin, file: libagentim_client.dylib}
          - {rid: osx-arm64, os: macos-latest, target: aarch64-apple-darwin, file: libagentim_client.dylib}
          - {rid: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, file: agentim_client.dll}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
      - if: matrix.zig
        run: python3 -m pip install --user cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: build
        shell: bash
        working-directory: sdk/client-rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            cargo zigbuild --release --locked -p agentim-client --target ${{ matrix.target }}${{ matrix.zig }}
          else
            cargo build --release --locked -p agentim-client --target ${{ matrix.target }}
          fi
          mkdir -p "$GITHUB_WORKSPACE/native/${{ matrix.rid }}"
          cp target/${{ matrix.target }}/release/${{ matrix.file }} "$GITHUB_WORKSPACE/native/${{ matrix.rid }}/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "native-${{ matrix.rid }}", path: native, if-no-files-found: error}

  xcframework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
      - run: sh sdk/client-rust/native/build-xcframework.sh "$PWD/xcframework"
      # The same iOS builds as dynamic libraries, for the Dart package
      # (Flutter wraps each into a framework in the app).
      - name: Dart prebuilts (iOS)
        run: |
          mkdir dart
          t=sdk/client-rust/target
          cp $t/aarch64-apple-ios/release/libagentim_client.dylib dart/agentim_client-ios-arm64.dylib
          cp $t/aarch64-apple-ios-sim/release/libagentim_client.dylib dart/agentim_client-ios-sim-arm64.dylib
          cp $t/x86_64-apple-ios/release/libagentim_client.dylib dart/agentim_client-ios-sim-x64.dylib
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dart-ios, path: dart, if-no-files-found: error}
      # And as a dynamic XCFramework of frameworks, for React Native.
      - run: sh sdk/client-rust/native/build-ios-frameworks.sh ios-frameworks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: ios-frameworks, path: ios-frameworks, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframework
          path: |
            xcframework/AgentIMCore.xcframework.zip
            xcframework/AgentIMCore.xcframework.zip.checksum
          if-no-files-found: error
      # The server the scenario talks to (a test build, not a package).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        run: cargo build --bin agentim
      - run: AGENTIM_BIN="$PWD/server/target/debug/agentim" sh sdk/client-swift/test-xcframework.sh xcframework/AgentIMCore.xcframework
      # The agentim-swift repository's content for this version (D125):
      # Package.swift points at the release's zip by URL and checksum.
      - name: Swift package (agentim-swift)
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' sdk/client-rust/Cargo.toml | head -1)
          sh sdk/client-swift/release-package.sh swift-package \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/sdk-v$v/AgentIMCore.xcframework.zip" \
            "$(cat xcframework/AgentIMCore.xcframework.zip.checksum)"
          (cd swift-package && swift package dump-package > /dev/null)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: swift-package, path: swift-package, if-no-files-found: error}

  # Android: the AAR (4 ABIs, 16 KB pages, JNI exports checked) and its
  # Maven Central bundle; its libraries are also the Dart prebuilts.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi --target x86_64-linux-android --target i686-linux-android
          rustup default "$RUST_VERSION"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: {distribution: temurin, java-version: 21}
      - name: android.jar, kotlinc (checked downloads)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o p.zip https://dl.google.com/android/repository/platform-35_r02.zip
          curl -sSfL -o k.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          sha256sum p.zip k.zip
          unzip -q p.zip && unzip -q k.zip
      - name: the AAR and the Maven Central bundle (unsigned until D126)
        working-directory: sdk/client-kotlin
        run: |
          ANDROID_NDK="$ANDROID_NDK_LATEST_HOME" ANDROID_JAR="$RUNNER_TEMP/android-35/android.jar" \
            KOTLINC="$RUNNER_TEMP/kotlinc/bin/kotlinc" sh android/build-aar.sh
          sh android/maven-bundle.sh build/agentim-client.aar build/maven
          mkdir -p "$GITHUB_WORKSPACE/aar" && cp build/agentim-client.aar build/maven-bundle.zip "$GITHUB_WORKSPACE/aar/"
      - name: Dart prebuilts (Android)
        run: |
          mkdir dart
          for pair in arm64-v8a:arm64 armeabi-v7a:arm x86_64:x64 x86:ia32; do
            cp "sdk/client-kotlin/build/aar/jni/${pair%%:*}/libagentim_client.so" "dart/agentim_client-android-${pair#*:}.so"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: android, path: aar, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dart-android, path: dart, if-no-files-found: error}

  # The Dart package (pub.dev): the prebuilt cores for every platform and
  # hook/prebuilt.json with their SHA-256, for the sdk-v<version> release.
  dart:
    needs: [native, xcframework, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: native-*, path: native, merge-multiple: true}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: dart-*, path: prebuilt, merge-multiple: true}
      - name: the package
        run: |
          cp native/linux-x64/libagentim_client.so prebuilt/agentim_client-linux-x64.so
          cp native/linux-arm64/libagentim_client.so prebuilt/agentim_client-linux-arm64.so
          cp native/osx-x64/libagentim_client.dylib prebuilt/agentim_client-macos-x64.dylib
          cp native/osx-arm64/libagentim_client.dylib prebuilt/agentim_client-macos-arm64.dylib
          cp native/win-x64/agentim_client.dll prebuilt/agentim_client-windows-x64.dll
          [ "$(ls prebuilt | wc -l)" -eq 12 ] || { ls prebuilt; exit 1; }
          v=$(sh sdk/version.sh)
          # Outside the checkout: pub leaves out what git ignores, and the
          # repository ignores hook/prebuilt.json.
          pkg="$RUNNER_TEMP/dart-package"
          mkdir -p "$pkg"
          cp -R sdk/client-flutter/pubspec.yaml sdk/client-flutter/README.md sdk/client-flutter/CHANGELOG.md \
            sdk/client-flutter/lib sdk/client-flutter/hook LICENSE "$pkg/"
          rm -f "$pkg/hook/prebuilt.json"
          sed -i '/^publish_to: none/d' "$pkg/pubspec.yaml"
          sh sdk/client-flutter/prebuilt.sh prebuilt "https://github.com/$GITHUB_REPOSITORY/releases/download/sdk-v$v/" "$pkg/hook/prebuilt.json"
          cat "$pkg/hook/prebuilt.json"
          echo "PKG=$pkg" >> "$GITHUB_ENV"
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: "3.10.0"}
      - name: what pub.dev would get
        run: |
          cd "$PKG" && dart pub get
          dart pub publish --dry-run 2>&1 | tee "$RUNNER_TEMP/pub.txt"
          grep -q "Package has 0 warnings" "$RUNNER_TEMP/pub.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dart-prebuilt, path: prebuilt, if-no-files-found: error}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: dart-package, path: "${{ env.PKG }}", if-no-files-found: error, include-hidden-files: false}

  # The package as an app gets it, on each desktop system: the hook
  # downloads this system's release build and checks its SHA-256.
  dart-install:
    needs: native
    name: Dart package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, rid: linux-x64, file: libagentim_client.so}
          - {os: macos-latest, rid: osx-arm64, file: libagentim_client.dylib}
          - {os: windows-latest, rid: win-x64, file: agentim_client.dll}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: "3.10.0"}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "native-${{ matrix.rid }}", path: native}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        shell: bash
        run: cargo build --bin agentim
      - shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          AGENTIM_BIN="$PWD/server/target/debug/agentim$exe" sh sdk/client-flutter/test-package.sh "$PWD/native/${{ matrix.rid }}/${{ matrix.file }}"

  nuget:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: 8.0.x}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: native-*, path: native, merge-multiple: true}
      - run: sh sdk/client-dotnet/pack.sh native nupkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: nupkg, path: nupkg, if-no-files-found: error}

  # The package installed into an app on each system: .NET loads the
  # library the package ships for that platform.
  nuget-install:
    needs: nuget
    name: NuGet package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: 8.0.x}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: nupkg, path: nupkg}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        shell: bash
        run: cargo build --bin agentim
      - shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          AGENTIM_BIN="$PWD/server/target/debug/agentim$exe" sh sdk/client-dotnet/test-package.sh nupkg

  npm:
    needs: [android, xcframework]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: android, path: android}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: ios-frameworks, path: ios-frameworks}
      - name: the native core into the React Native package
        run: |
          unzip -q android/agentim-client.aar 'jni/*' -d aar
          sh sdk/client-react-native/prepare-native.sh aar/jni ios-frameworks/AgentIMCore.xcframework
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: build
        run: |
          for p in client-web react client-react-native; do
            (cd "sdk/$p" && npm ci && npm run build)
          done
      - run: node sdk/check-npm-pack.mjs sdk/client-web sdk/react sdk/client-react-native
      - name: the tarballs
        run: |
          mkdir -p npm
          for p in client-web react client-react-native; do (cd "sdk/$p" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm"); done
          ls -l npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: npm, path: npm, if-no-files-found: error}

  # The AAR in an Android app, run in an emulator against the server.
  aar-android:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: android, path: android}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: {distribution: temurin, java-version: 17}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        run: cargo build --bin agentim
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: AGENTIM_BIN="$PWD/server/target/debug/agentim" sh sdk/client-kotlin/android/test-app.sh android/agentim-client.aar

  # The Flutter example app on Android with the package as published (the
  # hook downloads and checks the Android core), run in an emulator.
  flutter-android:
    needs: dart
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: dart-prebuilt, path: prebuilt}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with: {flutter-version: "3.47.7", channel: stable}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        run: cargo build --bin agentim
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: AGENTIM_BIN="$PWD/server/target/debug/agentim" sh sdk/client-flutter/example/test-android.sh prebuilt

  # The Unity package: a UPM tarball with every platform's core and the
  # .meta files Unity needs (checked); a test in the editor needs a Unity
  # license (docs/06 D123).
  unity:
    needs: [native, android, xcframework]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: native-*, path: native, merge-multiple: true}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: android, path: android}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: xcframework, path: xcframework}
      - run: |
          unzip -q android/agentim-client.aar 'jni/*' -d aar
          unzip -q xcframework/AgentIMCore.xcframework.zip -d xcframework
          sh sdk/client-dotnet/unity/pack.sh native aar/jni xcframework/AgentIMCore.xcframework/ios-arm64/libagentim_client.a unity
          mkdir check && tar -xzf unity/*.tgz -C check && python3 sdk/client-dotnet/unity/meta.py --check check/package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: unity, path: unity, if-no-files-found: error}

  # The React Native package in a new app, installed from its tarball.
  react-native-android:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: npm, path: npm}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with: {distribution: temurin, java-version: 17}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        run: cargo build --bin agentim
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: EMULATOR=1 AGENTIM_BIN="$PWD/server/target/debug/agentim" sh sdk/client-react-native/test-app.sh android npm

  react-native-ios:
    needs: npm
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: npm, path: npm}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
