# Client SDK packages (docs/12 §2.12.1): builds the native core for each
# platform, the XCFramework, the NuGet package and the npm packages, and
# uses each the way an app would, against a real server. Publishing waits
# on the registry accounts and names (docs/06 D124-D127).
#
# Third-party actions are pinned to a commit: these packages get published.
name: sdk-packages

on:
  push:
    paths: ["sdk/**", ".github/workflows/sdk-packages.yml"]
  pull_request:
    paths: ["sdk/**", ".github/workflows/sdk-packages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-packages-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: native core ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.28 and newer (Debian 10, Ubuntu 20.04, RHEL 8).
          - {rid: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, zig: ".2.28", file: libagentim_client.so}
          - {rid: linux-arm64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, zig: ".2.28", file: libagentim_client.so}
          - {rid: osx-x64, os: macos-latest, target: x86_64-apple-darwin, file: libagentim_client.dylib}
          - {rid: osx-arm64, os: macos-latest, target: aarch64-apple-darwin, file: libagentim_client.dylib}
          - {rid: win-x64, os: windows-latest, target: x86_64-pc-windows-msvc, file: agentim_client.dll}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
      - if: matrix.zig
        run: python3 -m pip install --user cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: build
        shell: bash
        working-directory: sdk/client-rust
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          if [ -n "${{ matrix.zig }}" ]; then
            cargo zigbuild --release --locked -p agentim-client --target ${{ matrix.target }}${{ matrix.zig }}
          else
            cargo build --release --locked -p agentim-client --target ${{ matrix.target }}
          fi
          mkdir -p "$GITHUB_WORKSPACE/native/${{ matrix.rid }}"
          cp target/${{ matrix.target }}/release/${{ matrix.file }} "$GITHUB_WORKSPACE/native/${{ matrix.rid }}/"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "native-${{ matrix.rid }}", path: native, if-no-files-found: error}

  xcframework:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-apple-ios --target aarch64-apple-ios-sim --target x86_64-apple-ios \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default "$RUST_VERSION"
      - run: sh sdk/client-rust/native/build-xcframework.sh "$PWD/xcframework"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframework
          path: |
            xcframework/AgentIMCore.xcframework.zip
            xcframework/AgentIMCore.xcframework.zip.checksum
          if-no-files-found: error
      # The server the scenario talks to (a test build, not a package).
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        run: cargo build --bin agentim
      - run: AGENTIM_BIN="$PWD/server/target/debug/agentim" sh sdk/client-swift/test-xcframework.sh xcframework/AgentIMCore.xcframework

  nuget:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: 8.0.x}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: native-*, path: native, merge-multiple: true}
      - run: sh sdk/client-dotnet/pack.sh native nupkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: nupkg, path: nupkg, if-no-files-found: error}

  # The package installed into an app on each system: .NET loads the
  # library the package ships for that platform.
  nuget-install:
    needs: nuget
    name: NuGet package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: 8.0.x}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: nupkg, path: nupkg}
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with: {workspaces: server}
      - working-directory: server
        shell: bash
        run: cargo build --bin agentim
      - shell: bash
        run: |
          exe=""; [ "$RUNNER_OS" = Windows ] && exe=.exe
          AGENTIM_BIN="$PWD/server/target/debug/agentim$exe" sh sdk/client-dotnet/test-package.sh nupkg

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - name: build
        run: |
          for p in client-web react client-react-native; do
            (cd "sdk/$p" && npm ci && npm run build)
          done
      - run: node sdk/check-npm-pack.mjs sdk/client-web sdk/react sdk/client-react-native
      - name: the tarballs
        run: |
          mkdir -p npm
          for p in client-web react client-react-native; do (cd "sdk/$p" && npm pack --pack-destination "$GITHUB_WORKSPACE/npm"); done
          ls -l npm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: npm, path: npm, if-no-files-found: error}
