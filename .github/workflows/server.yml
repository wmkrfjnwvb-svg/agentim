name: server

on:
  push:
    paths: ["server/**", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: server

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: unit + integration + websocket tests
        run: cargo test

  load:
    name: concurrency (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "50 clients x 100 msgs + 10 streams", clients: 50, messages: 100, streams: 10, chunks: 60 }
          - { name: "200 clients x 20 msgs + 20 streams", clients: 200, messages: 20, streams: 20, chunks: 40 }
          - { name: "10 clients x 500 msgs + 2 streams", clients: 10, messages: 500, streams: 2, chunks: 200 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --bins --examples
      - name: start server
        run: |
          ./target/release/agentim --demo --db "$RUNNER_TEMP/load.db" --addr 127.0.0.1:8080 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 50); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 0.1; done
      - name: load test with consistency checks
        run: |
          ./target/release/examples/loadtest --addr 127.0.0.1:8080 \
            --clients ${{ matrix.clients }} --messages ${{ matrix.messages }} \
            --streams ${{ matrix.streams }} --chunks ${{ matrix.chunks }} | tee result.txt
          { echo "### ${{ matrix.name }}"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"

  crash:
    name: kill -9 recovery (after ${{ matrix.after }}s)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        after: [1, 2, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - run: cargo build --release --bins --examples
      - name: crash while sending, restart, verify every ACKed message
        run: CRASH_AFTER=${{ matrix.after }} ./ci/crash_test.sh | tee result.txt
      - name: summary
        run: |
          { echo "### kill -9 after ${{ matrix.after }}s"; echo '```'; cat result.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ui:
    name: browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release --bins
      - name: install playwright
        run: |
          npm install --no-save --prefix ci playwright@1.56.1
          npx --prefix ci playwright install --with-deps chromium
      - name: start demo server
        run: |
          ./target/release/agentim --demo --db "$RUNNER_TEMP/ui.db" --addr 127.0.0.1:8099 --stream-idle-secs 6 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 50); do curl -sf http://127.0.0.1:8099/healthz && break; sleep 0.1; done
      - name: run UI checks
        run: PLAYWRIGHT="$PWD/ci/node_modules/playwright" BASE=http://127.0.0.1:8099 OUT=screenshots node ci/ui_smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: server/screenshots
      - if: failure()
        run: tail -n 200 "$RUNNER_TEMP/server.log"
