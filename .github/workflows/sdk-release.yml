# Client SDK release (docs/12 §2.12.1), on a tag sdk-v<version>: the
# packages are built and tested by sdk-packages.yml, then everything goes
# on a signed GitHub release (the Dart package downloads its native cores
# from it), then to each registry whose account the owner has set up
# (docs/06 §1.2: D124-D127). A registry not set up yet is skipped, and
# its package is on the release only.
#
# Turning a registry on (repository Settings → Secrets and variables):
#   npm         variable SDK_NPM=true, after the agentimhq org and trusted
#               publishing for this workflow are set up on npmjs.com
#   NuGet       variable NUGET_USER=<nuget.org user>, after trusted
#               publishing for this workflow is set up on nuget.org
#   pub.dev     variable SDK_PUB=true, after automated publishing (tag
#               pattern sdk-v{{version}}) is set up on pub.dev
#   SwiftPM     variable SWIFT_REPO=<owner>/agentim-swift and secret
#               SWIFT_REPO_TOKEN (contents: write on that repository)
#   Maven       secrets MAVEN_GROUP, CENTRAL_TOKEN (user:password of a
#               Central Portal token), MAVEN_GPG_KEY (armored private key)
name: sdk-release

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: v
        run: echo "version=$(sh sdk/version.sh "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"

  deps:
    uses: ./.github/workflows/deps.yml

  build:
    needs: [version, deps]
    uses: ./.github/workflows/sdk-packages.yml

  github-release:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {path: artifacts}
      - name: the release files
        run: |
          mkdir release
          cp artifacts/dart-prebuilt/* release/
          cp artifacts/xcframework/AgentIMCore.xcframework.zip release/
          cp artifacts/nupkg/*.nupkg artifacts/npm/*.tgz release/
          cp artifacts/android/agentim-client.aar artifacts/unity/*.tgz release/
          (cd artifacts && tar -czf ../release/agentim-swift.tar.gz swift-package)
          (cd release && sha256sum * > SHA256SUMS)
          cat release/SHA256SUMS
          # The checksums the Dart package recorded are these files'.
          python3 - <<'PY'
          import hashlib, json, pathlib
          m = json.loads(pathlib.Path("artifacts/dart-package/hook/prebuilt.json").read_text())
          for key, e in m["files"].items():
              got = hashlib.sha256(pathlib.Path("release", e["file"]).read_bytes()).hexdigest()
              assert got == e["sha256"], (key, got, e["sha256"])
          print(len(m["files"]), "Dart prebuilts match the package")
          PY
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - name: sign (Sigstore, keyless)
        run: |
          for f in release/*; do cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"; done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: "release/*"}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.version.outputs.version }}
        run: |
          {
            echo "AgentIM client SDKs $V (docs/12 §2.12)."
            echo
            echo "Each file has a Sigstore bundle (.sigstore.json) and build provenance; SHA256SUMS lists them all."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "SDK $V" --notes-file notes.md release/*

  npm:
    needs: github-release
    if: vars.SDK_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: npm, path: npm}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22, registry-url: "https://registry.npmjs.org"}
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11.20.0
      - name: publish, client-web first (the others depend on it)
        run: |
          for p in client-web react client-react-native; do
            npm publish --provenance --access public npm/agentimhq-$p-*.tgz
          done

  nuget:
    needs: github-release
    if: vars.NUGET_USER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: nupkg, path: nupkg}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: {dotnet-version: 8.0.x}
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with: {user: "${{ vars.NUGET_USER }}"}
      - run: dotnet nuget push nupkg/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

  pub:
    needs: github-release
    if: vars.SDK_PUB == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: dart-package, path: "${{ runner.temp }}/agentim_client"}
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with: {sdk: "3.10.0"}
      - working-directory: ${{ runner.temp }}/agentim_client
        run: dart pub get && dart pub publish --force

  swift:
    needs: github-release
    if: vars.SWIFT_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: swift-package, path: swift-package}
      - name: commit and tag in the Swift package's repository
        env:
          TOKEN: ${{ secrets.SWIFT_REPO_TOKEN }}
          REPO: ${{ vars.SWIFT_REPO }}
        run: |
          v=${GITHUB_REF_NAME#sdk-v}
          git clone "https://x-access-token:$TOKEN@github.com/$REPO.git" repo
          find repo -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R swift-package/. repo/
          cd repo
          git config user.name "agentim-release"
          git config user.email "agentim-release@users.noreply.github.com"
          git add -A
          git commit -m "AgentIM $v (from $GITHUB_REPOSITORY@$GITHUB_SHA)"
          git tag "$v"
          git push origin HEAD "$v"

  maven:
    needs: github-release
    runs-on: ubuntu-latest
    env:
      HAVE: ${{ secrets.CENTRAL_TOKEN != '' && secrets.MAVEN_GPG_KEY != '' && secrets.MAVEN_GROUP != '' }}
    steps:
      - if: env.HAVE != 'true'
        run: echo "Maven Central is not set up yet (docs/06 D126); the AAR is on the release."
      - if: env.HAVE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - if: env.HAVE == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: android, path: android}
      - if: env.HAVE == 'true'
        name: sign and upload the bundle
        env:
          GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          GROUP: ${{ secrets.MAVEN_GROUP }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
        run: |
          echo "$GPG_KEY" | gpg --batch --import
          SIGN=1 sh sdk/client-kotlin/android/maven-bundle.sh android/agentim-client.aar build/maven "$GROUP"
          curl -sSf -X POST "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC" \
            -H "Authorization: Bearer $(printf %s "$CENTRAL_TOKEN" | base64 -w0)" \
            -F "bundle=@build/maven-bundle.zip"
