name: site

# agentim.co (docs/en/design/developer-experience.md): build the homepage and the docs, check that every
# API and SDK member is explained, that every link works, and that pages fit
# phones, tablets and desktops in both themes. Cloudflare builds and serves
# the site from the repository itself (site/wrangler.jsonc).
# The reference pages are generated from server/ and sdk/, so changes there
# rebuild the site too.

on:
  # Run by hand; Cloudflare builds and deploys the site itself.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: every endpoint, request, MCP tool, config key and SDK member is explained
        run: node scripts/complete.mjs
      - name: build (reference pages generated, links validated)
        run: npm run build
      - name: install playwright
        run: |
          npm install --no-save --prefix ../server/ci playwright@1.56.1
          npx --prefix ../server/ci playwright install --with-deps chromium
      - name: layout at 390, 820 and 1440 px, light and dark
        run: PLAYWRIGHT="$PWD/../server/ci/node_modules/playwright" OUT=screenshots node scripts/layout.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-screenshots
          path: site/screenshots
