# Release (docs/12 §1). On a `v*` tag: builds the program for five
# targets, tests each install for real, signs everything (Sigstore, no
# keys) and publishes the GitHub release, the image on GHCR (amd64 +
# arm64, SBOM and provenance) and the Helm chart (OCI). On pull requests
# the same jobs run without publishing.
#
# Third-party actions are pinned to a commit (this workflow can publish).
name: release

on:
  # Tags always run (path filters do not apply to tag pushes); a branch
  # push runs it when the release machinery itself changed.
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - ".github/workflows/release.yml"
      - "deploy/**"
      - "CHANGELOG.md"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "deploy/**"
      - "server/**"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RUST_VERSION: "1.99.0"
  CARGO_TERM_COLOR: always
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: v
        run: |
          tag=""
          if [ "$PUBLISH" = true ]; then tag="$GITHUB_REF_NAME"; fi
          echo "version=$(sh deploy/release/version.sh $tag)" >> "$GITHUB_OUTPUT"

  deps:
    uses: ./.github/workflows/deps.yml

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - working-directory: server/console
        run: npm ci && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: console, path: server/console/dist, if-no-files-found: error}

  # The demo (docs/12 §3.4): the browser SDK with its wasm core, the React
  # components and the app; embedded like the console.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: 22}
      - shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
      - run: sh server/demo/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: demo, path: server/demo/dist, if-no-files-found: error}

  build:
    needs: [version, console, demo]
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: x86_64-unknown-linux-musl, os: ubuntu-latest, zig: true}
          - {target: aarch64-unknown-linux-musl, os: ubuntu-latest, zig: true}
          - {target: x86_64-apple-darwin, os: macos-latest}
          - {target: aarch64-apple-darwin, os: macos-latest}
          - {target: x86_64-pc-windows-msvc, os: windows-latest}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: console, path: server/console/dist}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: demo, path: server/demo/dist}
      # No build cache: a release is built from scratch.
      - shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target ${{ matrix.target }}
          rustup default "$RUST_VERSION"
      - if: matrix.zig
        run: python3 -m pip install --user cargo-zigbuild==0.23.4 ziglang==0.16.0
      - name: build
        shell: bash
        working-directory: server
        run: |
          if [ "${{ matrix.zig }}" = true ]; then
            cargo zigbuild --release --locked -p agentim --target ${{ matrix.target }}
          else
            cargo build --release --locked -p agentim --target ${{ matrix.target }}
          fi
      - name: the program reports the version being released
        if: "!contains(matrix.target, 'aarch64') || runner.arch == 'ARM64'"
        shell: bash
        run: |
          exe=server/target/${{ matrix.target }}/release/agentim
          [ -f "$exe.exe" ] && exe="$exe.exe"
          test "$("$exe" --version)" = "agentim ${{ needs.version.outputs.version }}"
      - if: runner.os != 'Windows'
        run: sh deploy/install/package.sh ${{ matrix.target }} server/target/${{ matrix.target }}/release/agentim dist
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "agentim-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist, stage | Out-Null
          Copy-Item server/target/${{ matrix.target }}/release/agentim.exe, LICENSE, README.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/$name"
          $h = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$name.sha256" -Value "$h  $name" -NoNewline -Encoding ascii
          Get-Content "dist/$name.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "dist-${{ matrix.target }}", path: dist, if-no-files-found: error}

  # The one-line install, for real, on each system: install, start, first
  # message; a corrupted download installs nothing.
  install:
    needs: build
    name: install on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {os: macos-latest, target: aarch64-apple-darwin}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "dist-${{ matrix.target }}", path: dist}
      - if: runner.os != 'Windows'
        run: sh deploy/install/test.sh dist
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./deploy/install/test.ps1 dist
      # The Intel build on Apple silicon (Rosetta).
      - if: runner.os == 'macOS'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: dist-x86_64-apple-darwin, path: intel}
      - if: runner.os == 'macOS'
        run: |
          tar -xzf intel/agentim-x86_64-apple-darwin.tar.gz -C intel
          arch -x86_64 intel/agentim --version

  image:
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: dist-*-linux-musl, path: dl}
      - name: binaries by Docker architecture
        run: |
          mkdir -p bin/amd64 bin/arm64
          tar -xzf dl/dist-x86_64-unknown-linux-musl/agentim-x86_64-unknown-linux-musl.tar.gz -C bin/amd64 agentim
          tar -xzf dl/dist-aarch64-unknown-linux-musl/agentim-aarch64-unknown-linux-musl.tar.gz -C bin/arm64 agentim
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/agentim" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each architecture runs and answers /readyz before anything is pushed.
      - name: test the image on amd64 and arm64
        run: |
          for arch in amd64 arm64; do
            docker buildx build -f deploy/Dockerfile --target release --platform linux/$arch \
              --build-context bin=bin --load -t "agentim:test-$arch" .
            docker run -d --name "t-$arch" --platform linux/$arch -p 18080:8080 "agentim:test-$arch" --db /var/lib/agentim/a.db
            ok=""
            for i in $(seq 1 120); do
              if curl -fs http://127.0.0.1:18080/readyz >/dev/null; then ok=1; break; fi
              sleep 1
            done
            docker logs "t-$arch"
            test -n "$ok"
            test "$(docker exec "t-$arch" agentim --version)" = "agentim ${{ needs.version.outputs.version }}"
            docker rm -f "t-$arch"
          done
      # High-severity issues with a fix stop the release (Grype, a checked
      # download; Trivy's actions and binaries were compromised in 2026-03).
      - name: scan the image (Grype 0.120.1)
        run: |
          v=0.120.1
          f="grype_${v}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/anchore/grype/releases/download/v$v/$f"
          echo "$GRYPE_SHA256  $f" | sha256sum -c
          tar -xzf "$f" grype
          for arch in amd64 arm64; do
            ./grype "agentim:test-$arch" --only-fixed --fail-on high
          done
        env:
          GRYPE_SHA256: 0a9ee97ef5ae2ee953b0a80098105052e846cdbe319a57d808b519c33cd1343d
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          target: release
          build-contexts: bin=bin
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - if: env.PUBLISH == 'true'
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"

  helm:
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with: {version: v4.3.0}
      - name: the chart points to this release's image
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          sed -i "s#^  repository: agentim\$#  repository: ghcr.io/$owner/agentim#" deploy/helm/agentim/values.yaml
          grep -q "repository: ghcr.io/$owner/agentim" deploy/helm/agentim/values.yaml
          helm lint deploy/helm/agentim
          helm template t deploy/helm/agentim > rendered.yaml
          grep -q "image: \"ghcr.io/$owner/agentim:${{ needs.version.outputs.version }}\"" rendered.yaml
          helm package deploy/helm/agentim --destination chart
      - if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push chart/agentim-${{ needs.version.outputs.version }}.tgz "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts" 2>&1 | tee push.txt
          echo "CHART_DIGEST=$(sed -n 's/^Digest: //p' push.txt)" >> "$GITHUB_ENV"
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - if: env.PUBLISH == 'true'
        run: |
          test -n "$CHART_DIGEST"
          cosign sign --yes "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts/agentim@$CHART_DIGEST"

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, deps, install, image, helm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {pattern: dist-*, path: release, merge-multiple: true}
      - name: install scripts, checksums
        run: |
          for f in install.sh install.ps1; do
            sed "s#__AGENTIM_REPO__#$GITHUB_REPOSITORY#" "deploy/install/$f" > "release/$f"
            (cd release && sha256sum "$f" > "$f.sha256")
          done
          (cd release && sha256sum agentim-* install.sh install.ps1 | grep -v '\.sha256' > SHA256SUMS)
          cat release/SHA256SUMS
          sh deploy/release/version.sh --notes "${{ needs.version.outputs.version }}" > notes.md
          test -s notes.md
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: {cosign-release: v3.1.3}
      - name: sign (Sigstore, keyless)
        run: |
          for f in release/agentim-*.tar.gz release/agentim-*.zip release/install.sh release/install.ps1 release/SHA256SUMS; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/agentim-*.tar.gz
            release/agentim-*.zip
            release/install.sh
            release/install.ps1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md release/*
