[package]
name = "agentim"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[[bin]]
name = "agentim"
path = "src/main.rs"

[dependencies]
agentim-core = { path = "../agentim-core" }
agentim-cluster = { path = "../agentim-cluster" }
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
