[package]
name = "agentim-cluster"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Several AgentIM nodes serving the same databases (docs/11-cluster.md)"

[dependencies]
agentim-core = { path = "../agentim-core" }
base64 = "0.22"
metrics = { version = "0.24.6", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "any", "postgres", "mysql"] }
tokio = { version = "1.53.2", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
futures-util = "0.3.34"
tokio-tungstenite = "0.30.0"
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
