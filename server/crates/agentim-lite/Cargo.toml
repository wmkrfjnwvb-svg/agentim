[package]
name = "agentim-lite"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "agentim-lite"
path = "src/main.rs"

[dependencies]
agentim-core = { path = "../agentim-core" }
tokio = { version = "1.53.2", features = ["full"] }

[dev-dependencies]
futures-util = "0.3.34"
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
