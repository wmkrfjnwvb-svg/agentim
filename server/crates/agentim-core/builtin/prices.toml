# Model prices for the built-in key (docs/en/design/assistants.md): USD per 1M tokens, from
# each provider's official pricing page on the date in `as_of`. Only models
# listed here can be used with a built-in key (their cost must be known);
# an app's own key can use every model the provider lists.
#
# A model id matches the longest `model` that is equal to it or a prefix
# followed by "-" (so "claude-sonnet-5-5" also covers dated variants).
# Optional per entry:
#   from = "YYYY-MM-DD"        the price applies from this day (UTC); the
#                              latest entry not in the future wins
#   long_above = N             prompts above N input tokens cost long_input /
#                              long_output / long_cache_read / long_cache_write
# Optional per provider ([provider.<name>]):
#   peak_hours_utc = [[a, b]]  Monday-Friday hours [a, b) priced as listed;
#   offpeak_factor = f         every other hour costs f times the price
#
# Deployments can override this file with `ai.prices_file`.

[provider.deepseek]
# https://api-docs.deepseek.com/quick_start/pricing (2026-11-06): off-peak
# is half; peak 01:00-04:00 and 06:00-10:00 UTC on weekdays. Chinese public
# holidays are off-peak there but charged as peak here (we can't know them).
peak_hours_utc = [[1, 4], [6, 10]]
offpeak_factor = 0.5

