<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentIM 单机版</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --text: #1d2330; --muted: #6b7280;
  --accent: #3b5bdb; --accent-soft: #e7ecff; --ai: #7048e8; --ai-soft: #f1ebff;
  --warn: #c2410c; --warn-soft: #fff1e6; --ok: #2b8a3e; --side: #fff8db;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --line: #2a303b; --text: #e6e8ec; --muted: #9aa3b2;
    --accent: #7c95ff; --accent-soft: #253058; --ai: #b197fc; --ai-soft: #2e2547;
    --warn: #ff9e64; --warn-soft: #3b2616; --ok: #69db7c; --side: #3a331a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button.small { padding: 1px 7px; font-size: 12px; }
input, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
code { font-size: 12px; background: var(--bg); padding: 0 4px; border-radius: 4px; }
#login { max-width: 520px; margin: 12vh auto; padding: 32px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
#login h1 { margin: 0 0 6px; font-size: 22px; }
#login p { color: var(--muted); margin: 0 0 20px; }
#login .who { display: flex; gap: 10px; flex-wrap: wrap; }
#app { display: none; height: 100vh; grid-template-columns: 250px 1fr 340px; }
#app.on { display: grid; }
.col { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.col:last-child { border-right: 0; border-left: 1px solid var(--line); }
.head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.head b { flex: 1; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; }
.conv { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: center; }
.conv:hover, .conv.on { background: var(--accent-soft); }
.conv .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { background: var(--accent); color: #fff; border-radius: 10px; padding: 0 7px; font-size: 12px; }
.tag { font-size: 11px; border-radius: 4px; padding: 0 5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.ai { background: var(--ai-soft); color: var(--ai); border-color: transparent; font-weight: 600; }
.tag.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.tag.ok { color: var(--ok); }
#msgs { padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 78%; align-self: flex-start; }
.msg.me { align-self: flex-end; }
.msg .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
.msg .bubble { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
.msg.agent .bubble { background: var(--ai-soft); border-color: transparent; }
.msg.me .bubble { background: var(--accent-soft); border-color: transparent; }
.msg.side .bubble { background: var(--side); border: 1px dashed var(--warn); }
.msg.recalled .bubble { color: var(--muted); font-style: italic; }
.msg .acts { display: none; gap: 4px; margin-top: 3px; }
.msg:hover .acts, .msg.streaming .acts { display: flex; }
.cursor::after { content: "▍"; animation: blink 1s steps(2) infinite; color: var(--ai); }
@keyframes blink { 50% { opacity: 0; } }
.sys { align-self: center; font-size: 12px; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; text-align: center; }
.sys.warn { color: var(--warn); border-color: var(--warn); }
.debug { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
#composer { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 8px; }
#composer textarea { flex: 1; resize: none; height: 42px; }
#hint { padding: 0 12px 8px; font-size: 12px; color: var(--warn); min-height: 8px; }
.section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.section h3 { margin: 0 0 8px; font-size: 13px; }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 4px 0; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0; background: var(--bg); }
.card textarea { width: 100%; height: 56px; margin: 4px 0; }
.log { font-size: 12px; border-bottom: 1px dashed var(--line); padding: 4px 0; word-break: break-word; }
.muted { color: var(--muted); }
.tabs { display: flex; gap: 4px; }
.tabs button.on { background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 900px) {
  #app.on { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .col { border-right: 0; border-bottom: 1px solid var(--line); }
  #convs { max-height: 180px; }
  #chat { min-height: 70vh; }
}
</style>
</head>
<body>
<div id="login">
  <h1>AgentIM 单机版演示</h1>
  <p>选择一个演示用户登录。alice 拥有 Aria、RefundBot、PingA 三个 Agent，bob 拥有 PongB。可以开两个浏览器窗口，分别登录不同用户。</p>
  <div class="who">
    <button class="primary" onclick="login('alice')">alice（Agent 所有者）</button>
    <button onclick="login('bob')">bob</button>
    <button onclick="login('carol')">carol</button>
  </div>
</div>

<div id="app">
  <div class="col" id="convs-col">
    <div class="head"><b id="me"></b><span class="tag" id="conn">连接中</span></div>
    <div class="scroll" id="convs"></div>
    <div class="section"><label class="row"><input type="checkbox" id="dbg" onchange="render()"> 显示 seq / hop / 版本</label></div>
  </div>
  <div class="col" id="chat">
    <div class="head"><b id="title">选择一个会话</b><span class="tag warn" id="observing" hidden>经 Agent 观察（只读，已记审计）</span></div>
    <div class="scroll" id="msgs-wrap"><div id="msgs"></div></div>
    <div id="composer"><textarea id="input" placeholder="输入消息，Enter 发送；群里用 @Aria 召唤" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button class="primary" onclick="send()">发送</button></div>
    <div id="hint"></div>
  </div>
  <div class="col">
    <div class="head"><b>控制台</b><div class="tabs"><button id="tab-agents" class="on" onclick="tab('agents')">我的 Agent</button><button id="tab-stats" onclick="tab('stats')">监控 / 审计</button></div></div>
    <div class="scroll" id="panel"></div>
  </div>
</div>

<script>
const S = { token: null, me: null, ws: null, rid: 0, pending: new Map(), convs: [], cur: null, logs: {}, side: {}, lastSeq: {}, sideSeq: {}, drafts: [], users: {}, myAgents: [], tab: 'agents', stats: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const newLog = () => ({ msgs: new Map(), order: [], sys: [] });

async function login(name) {
  const r = await fetch('/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name }) });
  if (!r.ok) { alert('登录失败'); return; }
  const j = await r.json();
  S.token = j.token; S.me = j.user;
  $('login').style.display = 'none'; $('app').classList.add('on'); $('me').textContent = S.me.name;
  connect();
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws?token=${S.token}`);
  S.ws = ws;
  ws.onopen = async () => {
    $('conn').textContent = '在线'; $('conn').className = 'tag ok';
    const h = await call({ op: 'hello' });
    h.users.forEach(u => S.users[u.id] = u); S.myAgents = h.my_agents;
    await refreshConvs();
    // The server keeps this device's position: sync what follows it.
    await sync();
    if (S.cur) await openConv(S.cur.conv_id);
    await refreshDrafts();
  };
  ws.onclose = () => { $('conn').textContent = '重连中'; $('conn').className = 'tag warn'; setTimeout(connect, 1500); };
  ws.onmessage = (e) => onFrame(JSON.parse(e.data));
}

function call(msg) {
  return new Promise((res, rej) => {
    const rid = ++S.rid; S.pending.set(rid, { res, rej });
    S.ws.send(JSON.stringify({ ...msg, rid }));
  }).catch(e => { toast(`${e.code || ''} ${e.message || ''}`); throw e; });
}

function toast(t) { $('hint').textContent = t; clearTimeout(toast.t); toast.t = setTimeout(() => $('hint').textContent = '', 6000); }

async function onFrame(f) {
  if (f.type === 'res') {
    const p = S.pending.get(f.rid); if (!p) return; S.pending.delete(f.rid);
    f.ok ? p.res(f) : p.rej(f.error); return;
  }
  if (f.type === 'event') {
    const ev = f.event, c = ev.conv_id;
    if (!S.convs.some(x => x.conv_id === c)) { refreshConvs(); return; }
    // After a sync the server pushes each conversation in order; a gap
    // means sync again.
    if (ev.seq === (S.lastSeq[c] || 0) + 1 || !(c in S.lastSeq)) { apply(c, ev); S.lastSeq[c] = ev.seq; ack(c); }
    else if (ev.seq > S.lastSeq[c]) await sync();
    if (S.cur && S.cur.conv_id === c) { render(); markRead(); } else bumpUnread(c, ev);
    if (ev.type === 'member.policy' || ev.type === 'member.joined') refreshConvs();
    return;
  }
  if (f.type === 'side') {
    const ev = f.event; (S.side[ev.conv_id] ||= []).push(ev); S.sideSeq[ev.conv_id] = ev.side_seq; ack(ev.conv_id);
    if (ev.type.startsWith('draft')) refreshDrafts();
    if (S.cur && S.cur.conv_id === ev.conv_id) render(); else renderPanel();
    return;
  }
  if (f.type === 'resync') {
    // The server held pushes back for this conversation: sync.
    await sync(); if (S.cur && S.cur.conv_id === f.conv_id) render();
    return;
  }
  if (f.type === 'delta') {
    const log = S.logs[f.conv_id]; if (!log || f.draft) return;
    const m = log.msgs.get(f.msg_id); if (!m || m.state !== 'streaming') return;
    m.content = f.reset ? f.text : m.content + f.text;
    if (S.cur && S.cur.conv_id === f.conv_id) render();
  }
}

function apply(c, ev) {
  const log = S.logs[c] ||= newLog();
  if (ev.msg) {
    const prev = log.msgs.get(ev.msg.msg_id);
    if (!prev) log.order.push(ev.msg.msg_id);
    if (!prev || ev.msg.version > prev.version || (ev.msg.version === prev.version && prev.state !== 'streaming')) log.msgs.set(ev.msg.msg_id, { ...ev.msg });
  } else log.sys.push(ev);
}

// Clients only sync (docs/08): what follows this device's position comes
// in rounds; each round is acknowledged once applied. One sync at a time.
async function sync() {
  if (S.syncing) { S.syncAgain = true; return; }
  S.syncing = true;
  try {
    do {
      S.syncAgain = false;
      for (let i = 0; i < 200; i++) {
        const r = await call({ op: 'sync' });
        const acks = [];
        for (const x of r.convs) {
          if (x.dissolved) { delete S.logs[x.conv_id]; continue; }
          (x.events || []).forEach(e => apply(x.conv_id, e.event));
          (x.side_events || []).forEach(ev => { (S.side[x.conv_id] ||= []).push(ev); });
          if (x.upto !== undefined) { S.lastSeq[x.conv_id] = Math.max(S.lastSeq[x.conv_id] || 0, x.upto); S.sideSeq[x.conv_id] = x.side_upto; acks.push({ conv_id: x.conv_id, seq: x.upto, side_seq: x.side_upto }); }
        }
        if (acks.length) await call({ op: 'ack', acks });
        if (!r.more) break;
      }
    } while (S.syncAgain);
  } finally { S.syncing = false; }
}

// Pushes are acknowledged in small batches.
function ack(c) {
  (S.toAck ||= new Set()).add(c);
  clearTimeout(ack.t);
  ack.t = setTimeout(() => {
    const acks = [...S.toAck].map(c => ({ conv_id: c, seq: S.lastSeq[c] || 0, side_seq: S.sideSeq[c] || 0 }));
    S.toAck.clear();
    if (acks.length) call({ op: 'ack', acks }).catch(() => {});
  }, 200);
}

// An owner watching a conversation through one of their agents (audited).
async function observe(c, agent) {
  for (;;) {
    const r = await call({ op: 'observe', conv_id: c, agent_id: agent, after_seq: S.lastSeq[c] || 0 });
    r.events.forEach(e => apply(c, e.event)); S.lastSeq[c] = r.upto_seq;
    if (!r.has_more) break;
  }
}

async function refreshConvs() {
  const r = await call({ op: 'list_convs' }); S.convs = r.convs;
  S.convs.forEach(c => c.members.forEach(m => S.users[m.user_id] ||= { id: m.user_id, name: m.name, kind: m.kind }));
  if (S.cur) S.cur = S.convs.find(c => c.conv_id === S.cur.conv_id) || S.cur;
  renderConvs(); renderPanel();
}

async function refreshDrafts() { const r = await call({ op: 'list_drafts' }); S.drafts = r.drafts; renderPanel(); }

function bumpUnread(c, ev) {
  const cv = S.convs.find(x => x.conv_id === c);
  if (cv && ev.type === 'msg.created' && ev.msg.sender_id !== S.me.id && !cv.observer_via) { cv.unread++; renderConvs(); }
}

async function openConv(id) {
  S.cur = S.convs.find(c => c.conv_id === id);
  S.logs[id] ||= newLog();
  await call({ op: 'focus', conv_id: id, ...(S.cur.observer_via ? { as_agent: S.cur.observer_via } : {}) });
  if (S.cur.observer_via) await observe(id, S.cur.observer_via); else await sync();
  $('title').textContent = S.cur.title; $('observing').hidden = !S.cur.observer_via;
  $('composer').style.display = S.cur.observer_via ? 'none' : 'flex';
  S.cur.unread = 0; markRead(); renderConvs(); render();
  const w = $('msgs-wrap'); w.scrollTop = w.scrollHeight;
}

function markRead() { if (S.cur && !S.cur.observer_via) call({ op: 'read', conv_id: S.cur.conv_id, seq: S.lastSeq[S.cur.conv_id] || 0 }).catch(() => {}); }

async function send() {
  const t = $('input').value.trim(); if (!t || !S.cur) return;
  $('input').value = '';
  await call({ op: 'send', conv_id: S.cur.conv_id, client_msg_id: crypto.randomUUID(), text: t });
}

function renderConvs() {
  $('convs').innerHTML = S.convs.map(c => `<div class="conv ${S.cur && S.cur.conv_id === c.conv_id ? 'on' : ''}" onclick="openConv('${c.conv_id}')">
    <span class="t">${esc(c.title)}</span>${c.observer_via ? `<span class="tag">经 ${esc(name(c.observer_via))} 观察</span>` : ''}
    ${c.members.some(m => m.kind === 'agent') ? '<span class="tag ai">AI</span>' : ''}${c.unread ? `<span class="badge">${c.unread}</span>` : ''}</div>`).join('');
}

const name = (id) => (S.users[id] && S.users[id].name) || String(id || '').slice(0, 8);
const STATE = { streaming: ['生成中', 'ai'], complete: ['已完成', 'ok'], cancelled: ['已中止', 'warn'], failed: ['失败', 'warn'], recalled: ['已撤回', ''] };

function sysText(ev) {
  const d = ev.data || {};
  switch (ev.type) {
    case 'conv.created': return '会话已创建';
    case 'member.joined': return d.kind === 'agent' ? `🤖 AI Agent「${d.name}」加入了会话（所有者 ${name(d.owner_id)}，读取范围 trigger=${d.trigger}）` : `${d.name} 加入了会话`;
    case 'member.policy': return `${name(d.user_id)} 策略更新：审批=${d.approval ? '开' : '关'}，trigger=${d.trigger}`;
    case 'agent.state':
      if (d.state === 'taken_over') return `🧑‍💼 ${name(d.by)} 接管了 ${name(d.agent_id)}，Agent 暂停发言`;
      if (d.state === 'tripped') return `⛔ 护栏熔断：${name(d.agent_id)}（${d.reason}：${d.detail}）`;
      if (d.state === 'stopped') return `⛔ Agent 已停下：${name(d.agent_id)}（${d.reason}：${d.detail}），等人发言后继续`;
      return `▶ ${name(d.agent_id)} 恢复工作${d.reason ? '（' + d.reason + '）' : ''}`;
    default: return ev.type;
  }
}

function render() {
  if (!S.cur) return;
  const c = S.cur.conv_id, log = S.logs[c] || newLog(), dbg = $('dbg').checked;
  const items = [];
  log.order.forEach(id => items.push({ k: log.msgs.get(id).created_seq, s: 0, m: log.msgs.get(id) }));
  log.sys.forEach(ev => items.push({ k: ev.seq, s: 0, sys: ev }));
  // Side-channel items are merged into the timeline by their anchor seq.
  (S.side[c] || []).filter(e => e.type === 'whisper' || e.type === 'ephemeral').forEach(e => items.push({ k: e.anchor_seq + 0.5, s: e.side_seq, side: e }));
  items.sort((a, b) => a.k - b.k || a.s - b.s);
  const mine = (m) => m.sender_id === S.me.id || S.myAgents.some(a => a.id === m.sender_id);
  $('msgs').innerHTML = items.map(it => {
    if (it.sys) return `<div class="sys ${it.sys.data && (it.sys.data.state === 'tripped' || it.sys.data.state === 'stopped') ? 'warn' : ''}">${esc(sysText(it.sys))}${dbg ? ` <span class="debug">seq ${it.sys.seq}</span>` : ''}</div>`;
    if (it.side) {
      const e = it.side, d = e.data;
      const label = e.type === 'whisper' ? `🤫 耳语 → ${esc(name(d.to))}（会话其他人不可见）` : `👁 仅 ${esc(name(d.to))} 可见`;
      return `<div class="msg side ${d.from === S.me.id ? 'me' : ''}"><div class="meta"><b>${esc(d.from_name)}</b>${d.from_type === 'agent' ? '<span class="tag ai">AI</span>' : ''}<span class="tag warn">${label}</span>${dbg ? `<span class="debug">side ${e.side_seq} · anchor ${e.anchor_seq}</span>` : ''}</div><div class="bubble">${esc(d.text)}</div></div>`;
    }
    const m = it.m, st = STATE[m.state], isAgent = m.sender_type === 'agent';
    const acts = [];
    if (m.state === 'streaming' && !S.cur.observer_via) acts.push(`<button class="small" onclick="call({op:'stream_cancel',msg_id:'${m.msg_id}'})">■ 停止</button>`);
    if (mine(m) && m.state !== 'recalled' && m.state !== 'streaming') {
      acts.push(`<button class="small" onclick="editMsg('${m.msg_id}')">修订</button>`);
      acts.push(`<button class="small" onclick="call({op:'recall',msg_id:'${m.msg_id}'})">撤回</button>`);
    }
    const revised = m.version > 1 && !['complete', 'streaming', 'failed', 'cancelled', 'recalled'].includes(m.state);
    return `<div class="msg ${isAgent ? 'agent' : ''} ${m.sender_id === S.me.id ? 'me' : ''} ${m.state}">
      <div class="meta"><b>${esc(m.sender_name)}</b>${isAgent ? '<span class="tag ai">AI</span>' : ''}${st ? `<span class="tag ${st[1]}">${st[0]}${m.state_reason ? '：' + esc(m.state_reason) : ''}</span>` : ''}${revised ? '<span class="tag">已修订</span>' : ''}
      ${dbg ? `<span class="debug">seq ${m.created_seq} · v${m.version} · hop ${m.hop}</span>` : ''}</div>
      <div class="bubble ${m.state === 'streaming' ? 'cursor' : ''}">${m.state === 'recalled' ? '消息已撤回' : esc(m.content)}</div>
      <div class="acts">${acts.join('')}</div></div>`;
  }).join('');
  const w = $('msgs-wrap'); if (w.scrollHeight - w.scrollTop - w.clientHeight < 200) w.scrollTop = w.scrollHeight;
  renderPanel();
}

async function editMsg(id) {
  const m = S.logs[S.cur.conv_id].msgs.get(id); const t = prompt('修订内容', m.content);
  if (t && t !== m.content) await call({ op: 'edit', msg_id: id, text: t });
}

function tab(t) { S.tab = t; $('tab-agents').classList.toggle('on', t === 'agents'); $('tab-stats').classList.toggle('on', t === 'stats'); if (t === 'stats') loadStats(); renderPanel(); }

async function loadStats() { S.stats = await call({ op: 'stats' }); renderPanel(); }

// Re-rendering must not wipe what the user is typing in the panel.
function keepInputs(fn) {
  const vals = {}, act = document.activeElement && document.activeElement.id;
  $('panel').querySelectorAll('input[id], textarea[id]').forEach(el => vals[el.id] = el.value);
  fn();
  Object.entries(vals).forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
  if (act && $(act)) $(act).focus();
}

function renderPanel() { keepInputs(renderPanelInner); }

function renderPanelInner() {
  if (S.tab === 'stats') return renderStats();
  const parts = [];
  const conv = S.cur, inConv = conv ? conv.members.filter(m => S.myAgents.some(a => a.id === m.user_id)) : [];
  if (!S.myAgents.length) parts.push('<div class="section muted">你没有 Agent。用 alice 登录，可以体验所有者的观察、耳语、审批、接管。</div>');
  if (conv && inConv.length) {
    parts.push(`<div class="section"><h3>本会话中我的 Agent</h3>${inConv.map(m => `<div class="card">
      <div class="row"><b>${esc(m.name)}</b><span class="tag ai">AI</span><span class="tag">trigger=${m.trigger}</span>${m.approval ? '<span class="tag warn">审批模式</span>' : ''}</div>
      <div class="row">
        <button class="small" onclick="pol('${m.user_id}',{approval:${!m.approval}})">${m.approval ? '关闭审批' : '开启审批'}</button>
        <button class="small" onclick="pol('${m.user_id}',{trigger:'${m.trigger === 'all' ? 'mention' : 'all'}'})">trigger → ${m.trigger === 'all' ? 'mention' : 'all'}</button>
        <button class="small" onclick="call({op:'takeover',conv_id:'${conv.conv_id}',agent_id:'${m.user_id}'})">接管</button>
        <button class="small" onclick="call({op:'release',conv_id:'${conv.conv_id}',agent_id:'${m.user_id}'})">交还</button>
        <button class="small" onclick="call({op:'reset_guard',conv_id:'${conv.conv_id}',agent_id:'${m.user_id}'})">重置护栏</button>
      </div>
      <div class="row"><input id="w-${m.user_id}" placeholder="耳语：只有这个 Agent 能看到" style="flex:1"><button class="small" onclick="whisper('${m.user_id}')">耳语</button></div>
    </div>`).join('')}</div>`);
  }
  parts.push(`<div class="section"><h3>待审批草稿（${S.drafts.length}）</h3>${S.drafts.length ? S.drafts.map(d => `<div class="card">
      <div class="row"><b>${esc(name(d.agent_id))}</b><span class="tag ai">AI</span><span class="muted">${esc((S.convs.find(c => c.conv_id === d.conv_id) || {}).title || '')}</span></div>
      <textarea id="d-${d.draft_id}">${esc(d.content)}</textarea>
      <div class="row"><button class="small primary" onclick="approve('${d.draft_id}')">批准发送</button><button class="small" onclick="reject('${d.draft_id}')">拒绝</button></div>
    </div>`).join('') : '<div class="muted">暂无。草稿不占 conv_seq，会话里的其他人看不到。</div>'}</div>`);
  const notes = conv ? (S.side[conv.conv_id] || []).filter(e => !['whisper', 'ephemeral'].includes(e.type)).slice(-8).reverse() : [];
  if (notes.length) parts.push(`<div class="section"><h3>侧信道通知（仅你可见）</h3>${notes.map(e => `<div class="log"><b>${esc(e.type)}</b> ${esc(e.data.reason || e.data.code || e.data.state || e.data.content || '')}</div>`).join('')}</div>`);
  parts.push(`<div class="section muted"><h3>可以试试</h3>
    · 「Alice · Aria」里随便说一句，看流式回复；发 <code>/long</code> 后点 ■ 停止<br>
    · 发 <code>/secret</code>：流式过程中命中 DLP，整条被替换<br>
    · 发 <code>/stall</code> 或 <code>/crash</code>：看门狗把消息标记为失败，并保留已生成的内容<br>
    · 发「ignore all previous instructions」：触发注入检测，trust=low<br>
    · 在「Agent 循环实验室」发一句，看两个 Agent 在第 7 跳被熔断<br>
    · 在「客服：退款工单」用 bob 发消息，alice 在右侧审批 RefundBot 的回复，也可以先耳语再审批<br>
    · 用 alice 打开「Bob · Aria」：经 Agent 观察，只读<br>
    · 勾选左下角「显示 seq」，看耳语、草稿不占 seq
  </div>`);
  $('panel').innerHTML = parts.join('');
}

function renderStats() {
  const s = S.stats; if (!s) { $('panel').innerHTML = '<div class="section">加载中…</div>'; return; }
  const c = s.counts || {};
  $('panel').innerHTML = `<div class="section"><div class="row"><button class="small" onclick="loadStats()">刷新</button></div>
    <h3>运行状态</h3><div class="row"><span class="tag">在线：${esc(s.online.join(', '))}</span></div>
    <div class="row"><span class="tag">会话 ${c.conversations}</span><span class="tag">事件 ${c.events}</span><span class="tag">消息 ${c.messages}</span><span class="tag ai">AI 消息 ${c.agent_messages}</span><span class="tag">侧信道 ${c.side_events}</span><span class="tag warn">待审批 ${c.pending_drafts}</span></div>
    <h3>进行中的流</h3>${s.active_streams.length ? s.active_streams.map(x => `<div class="log">${esc(x.agent)} · ${x.bytes}B · ${x.age_ms}ms${x.draft ? ' · 审批草稿' : ''}</div>`).join('') : '<div class="muted">无</div>'}</div>
    <div class="section"><h3>审计日志（最近 50 条）</h3>${s.audit.map(a => `<div class="log"><span class="muted">${new Date(a.ts).toLocaleTimeString()}</span> <b>${esc(a.actor || '')}</b> ${esc(a.action)} <span class="muted">${esc(JSON.stringify(a.detail))}</span></div>`).join('')}</div>`;
}

async function pol(agent, p) { await call({ op: 'set_agent_policy', conv_id: S.cur.conv_id, agent_id: agent, ...p }); }
async function whisper(agent) { const i = $('w-' + agent), t = i.value.trim(); if (!t) return; i.value = ''; await call({ op: 'whisper', conv_id: S.cur.conv_id, agent_id: agent, text: t }); }
async function approve(id) { const t = $('d-' + id).value; $('d-' + id).remove(); await call({ op: 'approve', draft_id: id, text: t }); refreshDrafts(); }
async function reject(id) { await call({ op: 'reject', draft_id: id }); refreshDrafts(); }
</script>
</body>
</html>
