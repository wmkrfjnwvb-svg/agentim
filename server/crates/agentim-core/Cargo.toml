[package]
name = "agentim-core"
description = "AgentIM core: messaging, sync, agents, governance and storage, shared by AgentIM Lite and AgentIM"
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Text of PDF knowledge files (docs/en/design/assistants.md).
pdf-extract = "=0.12.1"
argon2 = "0.6"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
data-encoding = "2"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
metrics = { version = "0.24.6", default-features = false }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
ring = "0.17"
rusty-s3 = "0.10.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha1 = "0.11"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "macros"] }
tokio = { version = "1.53.2", features = ["full"] }
tower = "0.5.3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tracing = "0.1.44"
# Optional span export ([tracing] otlp_endpoint, docs/en/design/tracing.md).
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "v7"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"

[lints]
workspace = true
